name: Database backup

# Daily encrypted dump of the Supabase database into a PRIVATE repository.
# Free Supabase has no backups of its own, so this is the only copy.
# Setup and restore steps: docs/backup-and-uptime.md

on:
  schedule:
    - cron: "17 2 * * *" # every night, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      BACKUP_REPO: ${{ vars.BACKUP_REPO }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      KEEP_DAYS: "30"
    steps:
      - name: Check the setup
        run: |
          missing=""
          [ -z "$DB_URL" ] && missing="$missing SUPABASE_DB_URL"
          [ -z "$AGE_PUBLIC_KEY" ] && missing="$missing BACKUP_AGE_PUBLIC_KEY"
          [ -z "$BACKUP_REPO" ] && missing="$missing BACKUP_REPO(variable)"
          [ -z "${{ secrets.BACKUP_REPO_TOKEN }}" ] && missing="$missing BACKUP_REPO_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing setup values:$missing (see docs/backup-and-uptime.md)"
            exit 1
          fi
          case "$AGE_PUBLIC_KEY" in age1*) ;; *) echo "::error::BACKUP_AGE_PUBLIC_KEY must start with age1 (public key, not the private one)"; exit 1;; esac

      - name: Tell the monitor we started
        if: env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/start" || true

      - name: Install database tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump the database
        run: |
          set -euo pipefail
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          mkdir -p dump
          # Your tables and data (schema + rows).
          "$PGDUMP" "$DB_URL" --no-owner --no-privileges --schema=public --file=dump/public.sql
          # Accounts (logins) live in the auth schema; rows only, the structure is created by Supabase.
          "$PGDUMP" "$DB_URL" --no-owner --no-privileges --schema=auth --data-only --file=dump/auth-data.sql
          # Sanity checks: a broken dump must fail the job, not look like a success.
          test "$(wc -c < dump/public.sql)" -gt 2000
          grep -q "CREATE TABLE public\." dump/public.sql
          grep -q "app_migrations" dump/public.sql
          test -s dump/auth-data.sql
          tar -czf backup.tar.gz -C dump public.sql auth-data.sql
          ls -l backup.tar.gz

      - name: Encrypt
        run: |
          set -euo pipefail
          name="octom-$(date -u +%Y-%m-%d_%H%M)Z.tar.gz.age"
          age -r "$AGE_PUBLIC_KEY" -o "$name" backup.tar.gz
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          # Plain files never leave this job.
          shred -u backup.tar.gz dump/*.sql

      - name: Store in the private repository
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${BACKUP_REPO}.git" store
          mkdir -p store/backups
          cp "$BACKUP_FILE" store/backups/
          # Keep the newest KEEP_DAYS files, drop older ones.
          ls -1 store/backups/*.age | sort | head -n -"$KEEP_DAYS" | xargs -r rm -f
          cd store
          git config user.name "octom backup"
          git config user.email "backup@octom.eu"
          git add -A
          git commit -m "Backup $(date -u +%Y-%m-%d)" -q
          git push -q origin HEAD
          echo "Stored $BACKUP_FILE; $(ls -1 backups/*.age | wc -l) backups kept."

      - name: Tell the monitor we succeeded
        if: success() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || true

      - name: Tell the monitor we failed
        if: failure() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/fail" || true
